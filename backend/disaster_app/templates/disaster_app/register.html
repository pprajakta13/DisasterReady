{% extends 'disaster_app/base.html' %}

{% block content %}

<section class="section">

    <div class="container">

        <div class="form-container">

            <h2>Create Account</h2>

            <p class="section-subtitle">
                Join DisasterReady and stay prepared.
            </p>

            {% if error %}
<p style="color:red; text-align:center; margin-bottom:15px;">
    {{ error }}
</p>
{% endif %}

            <form method="POST">

                {% csrf_token %}

                <input type="text"
                       name="name"
                       placeholder="Full Name"
                       required>

                <input type="email"
                       name="email"
                       placeholder="Email Address"
                       required>

                <input type="password"
                       name="password"
                       placeholder="Password"
                       required>

                <input type="text"
                       name="phone"
                       placeholder="Phone Number"
                       required>

                <input type="text"
                       name="location"
                       placeholder="City / District"
                       required>

                <button type="submit" class="primary-btn">

                    Register

                </button>

            </form>

            <p class="login-link">

                Already have an account?

                <a href="/login/">Login</a>

            </p>

        </div>

    </div>

</section>

{% endblock %}
