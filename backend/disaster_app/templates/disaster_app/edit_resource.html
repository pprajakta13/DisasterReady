<!DOCTYPE html>
<html>
<head>

<title>Edit Resource</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">

<h3>Edit Resource</h3>

</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Name</label>

<input
type="text"
name="name"
class="form-control"
value="{{ resource.name }}"
required>

</div>

<div class="mb-3">

<label>Resource Type</label>

<input
type="text"
name="resource_type"
class="form-control"
value="{{ resource.resource_type }}"
required>

</div>

<div class="mb-3">

<label>Address</label>

<textarea
name="address"
class="form-control"
rows="3"
required>{{ resource.address }}</textarea>

</div>

<div class="mb-3">

<label>Contact</label>

<input
type="text"
name="contact"
class="form-control"
value="{{ resource.contact }}"
required>

</div>

<button class="btn btn-success">

Update Resource

</button>

<a href="/manage-resources/" class="btn btn-secondary">

Back

</a>

</form>

</div>

</div>

</div>

</body>

</html>
