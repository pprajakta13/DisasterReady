<!DOCTYPE html>
<html>
<head>
    <title>Manage Alerts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h2>Manage Alerts</h2>

<a href="/add-alert/" class="btn btn-primary mb-3">
    Add Alert
</a>

<table class="table table-bordered table-striped">

<tr>
    <th>Disaster</th>
    <th>Severity</th>
    <th>Title</th>
    <th>Actions</th>
</tr>

{% for alert in alerts %}

<tr>

<td>{{ alert.disaster_type }}</td>
<td>{{ alert.severity }}</td>
<td>{{ alert.title }}</td>

<td>

<a href="/delete-alert/{{ alert.id }}/"
class="btn btn-danger btn-sm">
Delete
</a>

</td>

</tr>

{% endfor %}

</table>

</body>
</html>
