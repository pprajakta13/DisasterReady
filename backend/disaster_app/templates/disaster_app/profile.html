{% extends 'disaster_app/base.html' %}

{% block content %}

<section class="section">

<div class="container">

<div class="form-container">

<h2>👤 My Profile</h2>

{% if success %}

<div class="success-message">

{{ success }}

</div>

{% endif %}

<form method="POST">

{% csrf_token %}

<input
type="text"
name="name"
value="{{ user.name }}"
required>

<input
type="email"
value="{{ user.email }}"
readonly>

<input
type="text"
name="phone"
value="{{ user.phone }}">

<input
type="text"
name="location"
value="{{ user.location }}">

<button
class="primary-btn"
type="submit">

Update Profile

</button>

</form>

</div>

</div>

</section>

{% endblock %}
