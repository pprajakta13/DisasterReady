{% extends 'disaster_app/base.html' %}

{% block content %}

<section class="section">

    <div class="container">

        <div class="form-container">

            <h2>Welcome Back</h2>

            <p class="section-subtitle">
                Login to your DisasterReady account.
            </p>

            {% if error %}
                <p style="color:red; text-align:center; margin-bottom:15px;">
                    {{ error }}
                </p>
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button type="submit" class="primary-btn">
                    Login
                </button>

            </form>

            <p class="login-link">
                Don't have an account?
                <a href="/register/">Register</a>
            </p>

        </div>

    </div>

</section>

{% endblock %}
